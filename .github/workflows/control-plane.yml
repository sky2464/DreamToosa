# Guards the DreamToosa control plane.
#
# The "Dream Report" routine reads dreamtoosa/repos.yml and state.json at the start
# of every run, and its Phase 0 fail-safe stops the run cold if the manifest is
# missing or unparseable. That is the right behaviour, but it means a malformed
# control plane produces a routine that silently does nothing, daily, until someone
# reads a run log. This catches it at PR time instead — including on the routine's
# own daily report PRs, which rewrite state.json.

name: control-plane

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dreamtoosa/**'
      - 'dreams_*.py'
      - 'dreamtoosa_dreams_integration.py'
      - 'tests/**'
      - '.github/workflows/control-plane.yml'
  pull_request:
    paths:
      - 'dreamtoosa/**'
      - 'dreams_*.py'
      - 'dreamtoosa_dreams_integration.py'
      - 'tests/**'
      - '.github/workflows/control-plane.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest, state, and test suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: pip install --quiet 'pyyaml==6.0.3'

      - name: Validate control plane
        run: python3 dreamtoosa/validate.py

      - name: Run unit tests
        run: python3 -m unittest discover tests -v

  heartbeat:
    name: Hub heartbeat
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch report refs
        run: git fetch --no-tags origin '+refs/heads/dreamtoosa/report-*:refs/remotes/origin/dreamtoosa/report-*'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet 'pyyaml==6.0.3'

      - name: Heartbeat
        run: |
          set +e
          out=$(python3 "$GITHUB_WORKSPACE/dreamtoosa/triage_report.py" heartbeat --repo-root "$GITHUB_WORKSPACE" --today "$(date -u +%F)")
          code=$?
          ref=$(printf '%s\n' "$out" | awk '{for(i=1;i<=NF;i++) if(index($i,"ref=")==1) print substr($i,5)}')
          age=$(printf '%s\n' "$out" | awk '{for(i=1;i<=NF;i++) if(index($i,"age_days=")==1) print substr($i,10)}')
          date=$(git show "refs/remotes/${ref}:dreamtoosa/state.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("last_run",{}).get("date",""))')
          echo "ref=${ref} date=${date} age_days=${age}" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

